name: Documentation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # MPI over TCP and shared memory only: on some GitHub runners the UCX transport of MPICH
  # fails to open the Azure network adapter (mana_0), and MPI_Init aborts
  UCX_TLS: tcp,self,sm

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the pinned Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: FenicsX
          channel-priority: strict

      - name: Install FEMCubes (editable, includes the C++ kernels)
        run: python -m pip install --no-build-isolation --no-deps -e .

      - name: Build the HTML documentation (warnings are errors)
        run: python -m sphinx -b html docs docs/_build/html -W --keep-going

      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # GitHub Pages is published from the public repository only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
