name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # MPI over TCP and shared memory only: on some GitHub runners the UCX transport of MPICH
  # fails to open the Azure network adapter (mana_0), and MPI_Init aborts
  UCX_TLS: tcp,self,sm

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The version number is derived from the git tags.
          fetch-depth: 0

      - name: Set up the pinned Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: FenicsX
          channel-priority: strict

      - name: Install FEMCubes (editable, includes the C++ kernels)
        # The runtime dependencies come from the Conda environment; fenics-dolfinx
        # is not distributed on PyPI, so pip must not resolve it.
        run: python -m pip install --no-build-isolation --no-deps -e .

      - name: Run the fast test subset
        # Full-model, MPI and example tests are run locally before a release.
        run: python -m pytest src -m "not slow and not full_model and not mpi and not examples" -n auto
