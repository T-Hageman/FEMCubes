[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0", "setuptools-scm>=8,<10"]
build-backend = "scikit_build_core.build"

[project]
name = "femcubes"
dynamic = ["version"]
description = "Modular multi-physics finite-element framework built on FEniCSx"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tim Hageman" }]
keywords = ["finite element method", "FEniCSx", "multi-physics", "fracture", "phase field"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11"
# Lower bounds are the versions the test suite is run with (see
# environment.yml for the exact tested set). FEniCSx changes its interface
# between minor versions, so those packages are limited to one series.
dependencies = [
    "fenics-dolfinx>=0.10,<0.11",
    "fenics-basix>=0.10,<0.11",
    "fenics-ufl>=2025.2,<2025.3",
    "fenics-ffcx>=0.10,<0.11",
    "petsc4py>=3.24",
    "mpi4py>=4.1",
    "numpy>=2.3",
    "scipy>=1.16",
    "numba>=0.63",
    "threadpoolctl>=3.6",
    "h5py>=3.15",
    "matplotlib>=3.10",
    "gmsh>=4.15",
    "pyvista>=0.46",
    "imageio-ffmpeg>=0.6",          # Movie recording through PyVista
    "vtk>=9.5",
    "scikit-image>=0.26",
]

[project.optional-dependencies]
docs = [
    "sphinx>=9.1",
    "pydata-sphinx-theme>=0.17",
    "sphinx-autodoc-typehints>=3.9",
    "sphinxcontrib-bibtex>=2.7",
]
test = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.8",
]

[project.urls]
Homepage = "https://github.com/T-Hageman/FEMCubes"
Documentation = "https://t-hageman.github.io/FEMCubes/"
Repository = "https://github.com/T-Hageman/FEMCubes"
Issues = "https://github.com/T-Hageman/FEMCubes/issues"
Changelog = "https://github.com/T-Hageman/FEMCubes/blob/main/CHANGELOG.md"

[tool.scikit-build]
cmake.source-dir = "src/femcubes/solids/cpp_kernels"
cmake.build-type = "Release"
# The pybind11 extensions to build
build.targets = ["_viscoelastic_kernels_cpp", "_cohesive_viscoelastic_kernels_cpp"]

wheel.packages = ["src/femcubes"]

# The version is taken from the git tag (v0.1.0 -> 0.1.0); commits after a
# tag get a development version. Archives downloaded from GitHub carry the
# same information in .git_archival.txt.
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["src", "examples"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--tb=short", "--disable-warnings"]
filterwarnings = [
    "ignore:.*faster on contiguous arrays:numba.core.errors.NumbaPerformanceWarning",
]
markers = [
    "slow: long-running test outside the other categories",
    "integration: integration test",
    "unit: unit test",
    "mpi: test that launches mpirun",
    "full_model: test that runs a complete physics model",
    "examples: smoke test that runs an example script",
]

[tool.coverage.run]
source = ["femcubes"]
omit = [
    "*/tests/*",
    "test_*.py",
    "*_test.py",
    "*/petsc4py/*",
]

[tool.coverage.report]
omit = [
    "*/tests/*",
    "test_*.py",
    "*_test.py",
    "*/petsc4py/*",
]
